<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistulex</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="bilder/favicon.ico">
    
</head>
<body>
    <h1>Vistulex</h1>

    <div class="textbox">
        <div class="textarea-container">
            <span class="lang-label">Svenska</span>
            <textarea id="sv" placeholder="Skriv text"></textarea>
        </div>
    <div class="exchange-wrapper">
<img src="bilder/exchange.svg" class="exchange-icon" alt="Byt språk">
</div>

        <div class="textarea-container target">
            <span class="lang-label">Vistuliska</span>
            <textarea id="vs" placeholder="Översättning" readonly></textarea>
            <div class="copy-wrapper">
                <span id="copy-msg">Kopierat!</span>
                <img src="bilder/copy.svg" class="copy-icon" alt="Kopiera">
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
